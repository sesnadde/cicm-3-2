# Despliegue en Netlify. El portal estático se publica desde dist/ (npm run build) y la API (/api/*)
# corre como función en netlify/functions/api.mjs, con la misma app Express de src/app.js.
# Variables de entorno (Netlify → Project configuration → Environment variables, alcance «Functions»):
# SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_SERVICE_ROLE_KEY y SESSION_SECRET. Ver README.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
